name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # GitHub-hosted, and that is the whole point. This repo is public, so a
  # pull_request run executes a stranger's code; no self-hosted runner serves a
  # public repository, which is why no job in this file names one. Nothing here
  # needs credentials either — the hooks are self-contained Python and the gate
  # only reads git, so a throwaway VM is not a compromise but the right home.
  # The live end-to-end tier does need an authenticated claude CLI, so it is not
  # part of this repo's CI at all: a maintainer runs it by hand from a local
  # checkout before a release.
  selftests:
    name: Hook self-tests + public hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # public_gate.py scans the whole object database. The default
          # single-commit fetch is not that, and the gate refuses to pretend
          # a shallow clone cleared a history it never read.
          fetch-depth: 0
          # The commit under review, NOT the merge GitHub invents to test it.
          # On a pull_request event the default checkout is refs/pull/N/merge,
          # a synthetic commit GitHub authors with the PR author's own account
          # — so it carries an identity the branch itself does not, and since
          # 0.11.2 the gate reads committer and author on every commit object
          # and correctly fails a clean branch over it. That merge is a CI
          # artifact: it is never pushed, never reachable from main, and never
          # published. Scanning the head asks the question that has a stable
          # answer — "is what we are about to merge publishable?"
          #
          # Safe here because this is `pull_request`, not
          # `pull_request_target`: a fork PR gets no secrets, so checking out
          # its head grants a contributor nothing the merge ref would not.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # No setup-python: the runner image ships Python 3. Steps stay plain
      # invocations — no pipes, heredocs or shell-isms — so the suite runs the
      # same way here as it does in a contributor's terminal.
      - name: Show runner Python
        run: python3 --version
      - name: Routing hook self-test
        run: python3 tests/hook_selftest.py
      - name: Marketplace members + session-start checks
        run: python3 tests/ci_checks.py
      - name: Public-gate self-test
        run: python3 tests/gate_selftest.py
      - name: Public-gate corpus self-test
        run: python3 tests/gate_corpus_selftest.py
      - name: Public-hygiene gate
        run: python3 tests/public_gate.py
        env:
          # Identity terms cannot be stored in the gate — the term text is the
          # leak — so they arrive here. Absent on a fork's pull_request run,
          # where the gate prints the skip rather than failing.
          PUBLIC_GATE_PRIVATE_TERMS: ${{ secrets.PUBLIC_GATE_PRIVATE_TERMS }}
